<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Ad Performance Data - SHAHEER AURA</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f0f1e;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #1a1a2e;
    border: 1px solid #2a2a40;
    border-radius: 16px;
    padding: 32px;
    max-width: 480px;
    width: 90%;
    text-align: center;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #9ca3af; font-size: 14px; line-height: 1.6; }
  button {
    margin-top: 20px;
    background: #6C63FF;
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #log {
    margin-top: 20px;
    text-align: left;
    background: #000;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    font-family: monospace;
    font-size: 12px;
    color: #4ade80;
    white-space: pre-wrap;
    max-height: 240px;
    overflow-y: auto;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 SHAHEER AURA — Add Ad Performance Data</h1>
    <p>یہ بٹن دبانے سے 3 sample ad performance records آپ کی Firestore database (<code>adPerformance</code> collection) میں شامل ہو جائیں گے۔</p>
    <button id="btn" onclick="addData()">Add Ad Performance Data</button>
    <div id="log"></div>
  </div>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDfy0hIA6jJkhLRo0_4FO_e2OkJNbpdzcg",
      authDomain: "shaheer-aura.firebaseapp.com",
      projectId: "shaheer-aura",
      storageBucket: "shaheer-aura.firebasestorage.app",
      messagingSenderId: "797917647191",
      appId: "1:797917647191:web:31e60e7ec903b6a7dbee12"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const adData = [
      { name: "Facebook Ads", icon: "📱", impressions: 45000, clicks: 1200, revenue: 580 },
      { name: "Google Ads",   icon: "🔍", impressions: 32000, clicks: 980,  revenue: 420 },
      { name: "Twitter Ads",  icon: "📢", impressions: 12200, clicks: 674,  revenue: 245 }
    ];

    function log(msg) {
      const el = document.getElementById('log');
      el.style.display = 'block';
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
    }

    async function addData() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Adding...';
      log('Connecting to Firestore (project: shaheer-aura)...');

      try {
        for (const ad of adData) {
          const ref = await db.collection('adPerformance').add(ad);
          log(`✅ Added "${ad.name}" -> doc id: ${ref.id}`);
        }
        log('');
        log('🎉 DONE! All 3 documents added successfully.');
        log('Now go to your website, refresh, and check Ad Performance section.');
        btn.textContent = 'Done ✅';
      } catch (e) {
        log('❌ ERROR: ' + e.message);
        btn.textContent = 'Failed - Try Again';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
